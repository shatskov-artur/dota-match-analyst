name: CI

# Runs all three test suites plus a typecheck and a lint on every push and pull request.
#
# Why this exists: deploy-demo.yml publishes to Pages. Without this workflow a broken suite
# reaches the published demo unnoticed, because the suites only ever ran on a developer
# machine, by hand. deploy-demo now WAITS for this workflow and refuses to publish unless it
# passed — previously the two started in parallel, so a broken build was published and merely
# got a red cross next to it.
#
# No secrets: the server suite mocks ioredis and env, so nothing here needs a Valve, OpenDota,
# Stratz or Redis credential. Anything that does need one does not belong in CI.
#
# npm ci, never npm install: install is free to resolve a version the lockfile does not name,
# which is how a suite passes in CI against different code than a developer tested. ci fails
# instead when package.json and the lockfile disagree.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref — nothing is published from here.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint — eslint + scripts typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix shared
          npm ci --prefix server
          npm ci --prefix client

      - name: Lint
        run: npm run lint

      # scripts/ is covered by no tsconfig in client/ or server/, so nothing ever
      # typechecked capture-snapshot.ts, find-league.ts or the seed helpers — they only
      # failed when someone ran them.
      - name: Typecheck scripts
        run: npm run typecheck:scripts

  server:
    name: Server — tests + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            server/package-lock.json

      # shared/ is imported through the @shared alias and declares its own dependencies.
      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix server

      - name: Test
        run: npm test --prefix server -- --run

      # `build` is tsc — it fails the run on any type error, including in test files.
      - name: Typecheck
        run: npm run build --prefix server

  client:
    name: Client — tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix client

      - name: Test
        run: npm test --prefix client -- --run

      # `build` runs tsc before vite build, so this covers typecheck and bundling in one step.
      - name: Build
        run: npm run build --prefix client

  shared:
    name: Shared — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix shared

      - name: Test
        run: npm test --prefix shared -- --run

  demo:
    name: Demo — build + no-network verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            client/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix client

      - name: Build demo
        run: npm run build:demo --prefix client

      # The claim the README makes about the published demo — zero match-data API calls,
      # zero console errors — asserted rather than eyeballed. The script drives headless
      # Chrome over CDP; ubuntu-latest ships one at /usr/bin/google-chrome.
      - name: Verify demo makes no API calls
        run: |
          npm run preview:demo --prefix client &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:4173/ >/dev/null || { echo "preview server never came up"; exit 1; }
          node scripts/verify-demo.mjs --url=http://localhost:4173/ --matchId=8932722908
