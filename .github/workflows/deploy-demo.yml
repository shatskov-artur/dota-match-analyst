name: Deploy demo to GitHub Pages

# Builds the static snapshot demo and publishes it to Pages.
#
# The build needs no secrets: the recording it replays lives in demo-data/ in this
# repository, and the demo makes no match-data API calls. So this workflow never touches a
# Valve, OpenDota, Stratz or Redis credential — that is the whole point of the snapshot.

# Gated on CI rather than triggered by the push directly. The two used to start in
# parallel on the same event, so a broken client was published to Pages and merely got a
# red cross beside it — the failure was made visible but not prevented, which was the
# stated goal. workflow_run fires only after CI finishes, and the guard below refuses to
# publish anything but a successful run.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A manual dispatch has no triggering run to inspect; a workflow_run must have passed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run checks out the default branch by default, not the commit that was
      # tested. Pin it to the exact SHA CI ran against, or the artifact can be built from
      # different code than the one that passed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            shared/package-lock.json
            client/package-lock.json

      # shared/ is imported by the client through the @shared alias and declares its own
      # dependencies, so it has to be installed as well as client/.
      - name: Install dependencies
        run: |
          npm ci --prefix shared
          npm ci --prefix client

      - name: Build demo
        run: npm run build:demo --prefix client

      # Pages serves files starting with an underscore only when Jekyll is disabled.
      - name: Disable Jekyll
        run: touch client/dist-demo/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
