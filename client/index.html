<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Inline SVG data URI rather than a favicon.ico file: with no icon declared the browser
         requests /favicon.ico from the domain root, which 404s under a GitHub Pages project
         subdirectory. A data URI costs no request at all. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308080F'/%3E%3Cpath d='M16 4l10 12-10 12L6 16z' fill='%238B5CF6'/%3E%3C/svg%3E"
    />

    <!-- Fonts are self-hosted and imported from src/index.css (see scripts/fetch-fonts.mjs).
         They used to be <link>ed from fonts.googleapis.com, which meant a third-party request
         on every page load — not acceptable for the offline snapshot demo. -->
    <title>Dota 2 Match Analyst</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
